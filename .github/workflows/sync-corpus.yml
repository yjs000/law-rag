name: Sync legal corpus

on:
  schedule:
    # GitHub cron is UTC. 18:00 UTC is 03:00 KST on the following day.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-corpus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, Windows, X64, law-rag-ingestion]
    env:
      CORPUS_UPDATE_BUNDLE: ${{ github.workspace }}\.data\corpus-updates\${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.28
      - run: uv sync --all-packages --frozen --python 3.14
      - name: Prepare current corpus bundle
        run: >-
          uv run --project apps/collector law-rag-collector prepare-current
          --output "$env:CORPUS_UPDATE_BUNDLE"
        env:
          LAW_OPEN_API_OC: ${{ secrets.LAW_OPEN_API_OC }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Generate changed passage embeddings
        run: >-
          uv run --directory apps/api python -m scripts.backfill_embeddings generate-cache
          --bundle "$env:CORPUS_UPDATE_BUNDLE"
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      - name: Apply prepared corpus atomically
        run: >-
          uv run --project apps/collector law-rag-collector apply-prepared
          --bundle "$env:CORPUS_UPDATE_BUNDLE"
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
